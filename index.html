<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#efe7db">
  <title>Maaike & Bas · 25 juni 2027</title>
  <meta name="description" content="Uitnodiging voor de bruiloft van Maaike & Bas op 25 juni 2027.">
  <meta property="og:title" content="Maaike & Bas gaan trouwen">
  <meta property="og:description" content="Vrijdag 25 juni 2027 · Strandclub Witsand, Noordwijk">
  <!-- Plaatje dat WhatsApp en andere apps bij de link tonen. Moet een volledig adres zijn: aanpassen bij een eigen domein. -->

  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500&family=Herr+Von+Muellerhoff&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-sealed">
  <!-- Ornamenten, hergebruikt in envelop en pagina -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

    </symbol>
  </svg>

  <!-- Envelop: wordt in envelope.js opgebouwd uit assets/envelop-strand.png -->
  <div class="envelope" id="envelope">
    <div class="env-backdrop"></div>
    <div class="env-stage" id="env-stage">
      <div class="env-scene">
        <div class="env-sea" aria-hidden="true"></div>
        <div class="env-inside" aria-hidden="true">
          <img src="assets/sfeer-zonsondergang.jpg" alt="">
          <div class="env-inside-text">
            <span class="lettering"></span>
            <span class="env-inside-date">25 · 06 · 2027</span>
          </div>
        </div>
        <div class="env-flaps"></div>
        <div class="env-sheen" aria-hidden="true"></div>
        <div class="env-glow-slot"></div>
        <div class="env-seal"></div>
      </div>
      <p class="env-addressee" id="envelope-name"></p>
      <p class="env-hint">Tik op het zegel</p>
      <button class="env-seal-button" id="seal" type="button" aria-label="Open de uitnodiging"></button>
    </div>
    <button class="env-skip" id="env-skip" type="button" hidden>Direct naar de uitnodiging</button>
  </div>

  <header class="hero">
    <svg class="emboss hero-ornament" aria-hidden="true"><use href="#sprig" /></svg>
    <p class="eyebrow hero-greeting" id="greeting"></p>
    <p class="hero-lead">Wij gaan trouwen</p>
    <h1 class="hero-names lettering" role="img" aria-label="Maaike &amp; Bas"></h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="hero-date" id="hero-date">Vrijdag 25 juni 2027</p>
    <p class="eyebrow hero-place" id="hero-place">Strandclub Witsand · Noordwijk</p>

    <p class="load-problem" id="load-problem" hidden>De uitnodiging laadt niet goed. Open de link opnieuw, het liefst in Safari of Chrome op een recente telefoon of computer.</p>
    <noscript><p class="load-problem">Deze uitnodiging werkt alleen met JavaScript aan. Open de link in Safari of Chrome.</p></noscript>

    <form class="code-form" id="code-form" hidden>
      <label for="code-input">Vul de code uit je uitnodiging in</label>
      <div class="code-row">
        <input id="code-input" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        <button class="button" type="submit">Open</button>
      </div>
      <p class="code-error" id="code-error" role="alert"></p>
    </form>

    <a class="scroll-cue" id="scroll-cue" href="#aftellen" hidden><span>Scroll</span><i></i></a>
  </header>

  <main id="invitation" hidden></main>

  <a class="rsvp-float" id="rsvp-float" href="#rsvp" hidden>RSVP</a>

  <script>
    // Vangnet: start de site niet (een heel oude browser, of een bestand dat niet laadt),
    // dan blijft de gast niet achter een dichte envelop hangen maar ziet een melding.
    setTimeout(function () {
      if (window.appStarted) return;
      var envelope = document.getElementById('envelope');
      if (envelope) envelope.parentNode.removeChild(envelope);
      document.body.className = '';
      document.getElementById('load-problem').hidden = false;
    }, 12000);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
